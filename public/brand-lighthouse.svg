<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Faro WhatsYournumber">
  <defs>
    <linearGradient id="wynBeamL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wynBeamR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="wynGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="wynTower">
      <path d="M106 138 h44 l13 78 h-70 z"/>
    </clipPath>
  </defs>

  <!-- light beams -->
  <path d="M112 88 L2 52 L2 148 L112 116 Z" fill="url(#wynBeamL)"/>
  <path d="M144 88 L254 52 L254 148 L144 116 Z" fill="url(#wynBeamR)"/>

  <!-- lantern glow -->
  <circle cx="128" cy="102" r="40" fill="url(#wynGlow)" opacity="0.9"/>

  <g stroke="#10b981" fill="#10b981" stroke-linejoin="round">
    <!-- finial + roof -->
    <circle cx="128" cy="22" r="6" stroke="none"/>
    <path d="M128 32 l36 34 h-72 z" stroke-width="6"/>
    <rect x="86" y="66" width="84" height="10" rx="5" stroke="none"/>
    <!-- lantern room -->
    <rect x="102" y="80" width="52" height="40" rx="6" fill="none" stroke-width="9"/>
    <circle cx="128" cy="100" r="11" fill="#ffffff" stroke="none"/>
    <!-- gallery -->
    <rect x="92" y="124" width="72" height="11" rx="5.5" stroke="none"/>
    <!-- tower body -->
    <g clip-path="url(#wynTower)" stroke="none">
      <path d="M106 138 h44 l13 78 h-70 z" fill="#10b981" opacity="0.14"/>
      <g fill="#10b981">
        <path d="M92 132 l40 0 l-40 30 z" transform="translate(6,4)"/>
        <path d="M104 172 l52 -14 l4 22 l-54 14 z"/>
        <path d="M100 210 l60 -18 l3 20 l-63 14 z"/>
      </g>
    </g>
    <path d="M106 138 h44 l13 78 h-70 z" fill="none" stroke-width="8"/>
    <!-- base -->
    <rect x="84" y="214" width="88" height="11" rx="5.5" stroke="none"/>
  </g>

  <!-- waves -->
  <g stroke="#10b981" fill="none" stroke-linecap="round">
    <path d="M16 234 c20-13 40-13 60 0 c20 13 40 13 60 0 c20-13 40-13 60 0" stroke-width="11" opacity="0.9"/>
    <path d="M40 250 c18-10 36-10 54 0 c18 10 36 10 54 0" stroke-width="9" opacity="0.5"/>
  </g>
</svg>
