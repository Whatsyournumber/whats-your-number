<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Faro WhatsYournumber">
  <defs>
    <linearGradient id="wynBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="wynBeam2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="wynGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="0.45" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- light beams -->
  <path d="M118 92 L4 58 L4 150 L118 116 Z" fill="url(#wynBeam)"/>
  <path d="M138 92 L252 58 L252 150 L138 116 Z" fill="url(#wynBeam2)"/>

  <!-- lantern glow -->
  <circle cx="128" cy="104" r="34" fill="url(#wynGlow)"/>

  <!-- tower -->
  <g fill="#10b981">
    <!-- roof -->
    <path d="M128 30 l34 34 h-68 z"/>
    <rect x="86" y="64" width="84" height="9" rx="4.5"/>
    <circle cx="128" cy="24" r="6"/>
    <!-- lantern room -->
    <rect x="100" y="78" width="56" height="42" rx="5" fill="none" stroke="#10b981" stroke-width="9"/>
    <!-- gallery -->
    <rect x="92" y="122" width="72" height="10" rx="5"/>
    <!-- body with stripes -->
    <path d="M104 136 h48 l14 84 h-76 z" opacity="0.18"/>
    <path d="M104 136 h48 l2 12 h-52 z"/>
    <path d="M107 160 h44 l3 18 h-50 z"/>
    <path d="M110 190 h40 l4 22 h-48 z"/>
    <path d="M104 136 h48 l14 84 h-76 z" fill="none" stroke="#10b981" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- waves -->
  <g fill="#10b981">
    <path d="M20 224 c22-14 44-14 66 0 c22 14 44 14 66 0 c22-14 44-14 66 0 v8 c-22 14-44 14-66 0 c-22-14-44-14-66 0 c-22 14-44 14-66 0 z" opacity="0.85"/>
    <path d="M40 244 c22-12 44-12 66 0 c22 12 44 12 66 0 v6 c-22 12-44 12-66 0 c-22-12-44-12-66 0 z" opacity="0.5"/>
  </g>
</svg>
